<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Manrope:wght@400..800&display=swap" rel="stylesheet">
<style>
body { margin:0; background:#0B0F0E; }
a { color:#00BD80; } a:hover { color:#5FE0B4; }
@keyframes dcRise { from { opacity:0; transform:translateY(26px); } to { opacity:1; transform:none; } }
@keyframes dcPulse { 0%,100% { box-shadow:0 0 0 0 rgba(0,189,128,.55); } 70% { box-shadow:0 0 0 10px rgba(0,189,128,0); } }
@keyframes dcOrb { 0%,100% { transform:translate(0,0) scale(1); } 50% { transform:translate(-40px,30px) scale(1.15); } }
</style>
<script type="module">import * as m from './copy.js'; window.DCASE_COPY = m.COPY; window.DCASE_LANG = m.getLang();</script>
</helmet>
<div style="background:#0B0F0E;color:#F2F5F3;font-family:Manrope,system-ui,sans-serif;font-size:16px;line-height:1.5;overflow-x:clip;min-height:100vh;-webkit-font-smoothing:antialiased">
  <div data-progress style="position:fixed;top:0;left:0;height:2px;width:0;background:#00BD80;z-index:60"></div>
  <div style="position:fixed;top:0;left:0;right:0;z-index:50"><dc-import name="SiteNav" theme="dark" lang="{{ lang }}" on-lang="{{ setLang }}" hint-size="100%,72px"></dc-import></div>

  <section style="position:relative;padding:150px 24px 64px;overflow:hidden">
    <div style="position:absolute;top:-160px;left:-120px;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(0,189,128,.22),rgba(0,189,128,0) 65%);filter:blur(30px);animation:dcOrb 12s ease-in-out infinite"></div>
    <div style="position:relative;max-width:1200px;margin:0 auto"><div style="display:flex;flex-direction:column;gap:22px;max-width:760px">
      <div style="display:inline-flex;align-items:center;gap:10px;align-self:flex-start;padding:7px 14px 7px 10px;border-radius:999px;border:1px solid rgba(0,189,128,.35);background:rgba(0,189,128,.1);font-size:12.5px;font-weight:700;color:#7FE3C0;animation:dcRise .8s ease-out both"><span style="width:8px;height:8px;border-radius:50%;background:#00BD80;animation:dcPulse 2s infinite"></span>{{ p.eyebrow }}</div>
      <h1 style="margin:0;font-family:'Bricolage Grotesque',Manrope,sans-serif;font-weight:700;font-size:clamp(44px,6vw,80px);line-height:.98;letter-spacing:-.035em;animation:dcRise .9s .1s ease-out both">{{ p.title1 }} <span style="color:#00BD80">{{ p.title2 }}</span></h1>
      <p style="margin:0;font-size:18px;line-height:1.6;color:#A8B3AE;text-wrap:pretty;animation:dcRise .9s .2s ease-out both">{{ p.sub }}</p>
    </div></div>
  </section>

  <section style="max-width:1200px;margin:0 auto;padding:24px 24px 0">
    <div data-reveal style="font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:#00BD80;margin-bottom:22px">{{ p.teamsTitle }}</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px">
      <sc-for list="{{ teams }}" as="tm" hint-placeholder-count="3">
        <div id="{{ tm.id }}" data-reveal data-reveal-delay="{{ tm.delay }}" style="scroll-margin-top:100px;padding:30px 28px;border-radius:24px;background: {{ tm.bg }};border:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:16px;transition:transform .35s,box-shadow .35s" style-hover="transform:translateY(-6px);box-shadow:0 30px 60px -30px rgba(0,189,128,.4)">
          <div style="width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.08);display:grid;place-items:center;color:#00BD80"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{ tm.icon }}"></path></svg></div>
          <h2 style="margin:0;font-family:'Bricolage Grotesque',Manrope,sans-serif;font-weight:700;font-size:28px;letter-spacing:-.02em;line-height:1.1">{{ tm.title }}</h2>
          <p style="margin:0;font-size:15px;color:#C9D1CD;line-height:1.55">{{ tm.desc }}</p>
          <div style="display:flex;flex-direction:column;gap:9px;padding-top:14px;border-top:1px solid rgba(255,255,255,.1)"><sc-for list="{{ tm.points }}" as="pt" hint-placeholder-count="3"><div style="display:flex;gap:10px;font-size:14px;color:#E6EBE8"><span style="flex:none;width:6px;height:6px;border-radius:50%;background:#00BD80;margin-top:8px"></span>{{ pt.text }}</div></sc-for></div>
        </div>
      </sc-for>
    </div>
  </section>

  <section style="max-width:1200px;margin:0 auto;padding:110px 24px 0">
    <div data-reveal style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:36px"><h2 style="margin:0;font-family:'Bricolage Grotesque',Manrope,sans-serif;font-weight:700;font-size:clamp(32px,4.2vw,54px);line-height:1.02;letter-spacing:-.03em">{{ p.areasTitle }}</h2><p style="margin:0;font-size:17px;color:#A8B3AE">{{ p.areasSub }}</p></div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px">
      <sc-for list="{{ areas }}" as="a" hint-placeholder-count="10">
        <div id="{{ a.id }}" data-reveal data-reveal-delay="{{ a.delay }}" style="scroll-margin-top:100px;position:relative;overflow:hidden;padding:30px 28px;border-radius:24px;background:#121816;border:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:14px;transition:border-color .3s,transform .3s" style-hover="border-color:rgba(0,189,128,.45);transform:translateY(-4px)">
          <div style="position:absolute;top:-60px;right:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(0,189,128,.18),transparent 65%)"></div>
          <div style="display:flex;align-items:center;justify-content:space-between;gap:10px"><span style="padding:5px 11px;border-radius:999px;border:1px solid rgba(0,189,128,.35);background:rgba(0,189,128,.1);color:#7FE3C0;font-size:11.5px;font-weight:800">{{ a.label }}</span><span style="font-family:'Bricolage Grotesque',Manrope,sans-serif;font-size:13px;font-weight:700;color:#6F7B76;letter-spacing:.08em">{{ a.n }}</span></div>
          <h3 style="margin:4px 0 0;font-family:'Bricolage Grotesque',Manrope,sans-serif;font-weight:700;font-size:26px;line-height:1.1;letter-spacing:-.02em;text-wrap:balance">{{ a.title }}</h3>
          <p style="margin:0;font-size:15px;color:#A8B3AE;line-height:1.5">{{ a.tag }}</p>
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:6px;padding-top:16px;border-top:1px solid rgba(255,255,255,.08)"><sc-for list="{{ a.points }}" as="pt" hint-placeholder-count="3"><div><div style="font-weight:800;font-size:14px">{{ pt.title }}</div><div style="font-size:13px;color:#A8B3AE;margin-top:3px;line-height:1.5">{{ pt.desc }}</div></div></sc-for></div>
        </div>
      </sc-for>
    </div>
  </section>

  <section style="max-width:1200px;margin:0 auto;padding:110px 24px 120px">
    <div data-reveal style="position:relative;overflow:hidden;border-radius:32px;padding:clamp(40px,6vw,72px);background:#0B3D2E;border:1px solid rgba(0,189,128,.35);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:28px">
      <div style="position:absolute;top:-160px;right:-120px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(0,189,128,.5),transparent 65%);filter:blur(20px);animation:dcOrb 10s ease-in-out infinite"></div>
      <div style="position:relative;max-width:620px;display:flex;flex-direction:column;gap:12px"><h2 style="margin:0;font-family:'Bricolage Grotesque',Manrope,sans-serif;font-weight:700;font-size:clamp(30px,3.8vw,48px);line-height:1.04;letter-spacing:-.03em;text-wrap:balance">{{ cta.title }}</h2><p style="margin:0;font-size:16px;color:#BFE9D8">{{ cta.sub }}</p></div>
      <a href="Contact.dc.html" style="position:relative;display:inline-flex;align-items:center;gap:10px;height:54px;padding:0 24px;border-radius:999px;background:#00BD80;color:#062B20;text-decoration:none;font-weight:800;font-size:15.5px" style-hover="transform:translateY(-2px);color:#062B20">{{ cta.button }}<svg width="16" height="16" viewBox="0 0 16 16"><path d="M2 8 H14 M9 3 L14 8 L9 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
    </div>
  </section>

  <dc-import name="SiteFooter" theme="dark" lang="{{ lang }}" hint-size="100%,520px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;en&quot;,&quot;options&quot;:[&quot;en&quot;,&quot;tr&quot;],&quot;tsType&quot;:&quot;'en' | 'tr'&quot;,&quot;section&quot;:&quot;Content&quot;}}">
const ICONS = ['M3 5h18v11H3zM8 21h8M12 16v5','M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75','M21 12a8 8 0 0 1-8 8H8l-5 3V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8zM8 12h8M8 9h5'];
const BG = ['linear-gradient(160deg,#16352A,#121816)','linear-gradient(160deg,#0B3D2E,#121816)','linear-gradient(160deg,#1B5C46,#121816)'];
class Component extends DCLogic {
  state = { lang: null, copy: window.DCASE_COPY || null, stored: window.DCASE_LANG || null, pc: null };
  componentDidMount(){ Promise.all([import('./site.js'), import('./copy-pages.js'), import('./copy.js')]).then(([s, pcm, m]) => { this.mod = m; this.setState({ pc: pcm.PAGES_COPY, copy: m.COPY, stored: m.getLang() }, () => { this.cleanups = [s.setupAnchors(), s.setupReveal(), s.setupProgress()]; }); }); }
  componentWillUnmount(){ (this.cleanups || []).forEach(f => f && f()); }
  lang(){ return this.state.lang || this.props.lang || this.state.stored || 'en'; }
  renderVals(){
    const lang = this.lang(), pc = this.state.pc, p = pc ? pc[lang].solutions : { teams: [], areas: [] }, C = this.state.copy;
    return {
      lang, setLang: l => { this.setState({ lang: l }); if (this.mod) this.mod.setLangStored(l); }, p, cta: C ? C[lang].cta : {},
      teams: (p.teams || []).map((t, i) => ({ ...t, icon: ICONS[i], bg: BG[i], delay: i * 100, points: t.points.map(x => ({ text: x })) })),
      areas: (p.areas || []).map((a, i) => ({ ...a, n: String(i + 1).padStart(2, '0'), delay: (i % 2) * 100, points: a.points.map(x => ({ title: x[0], desc: x[1] })) })),
    };
  }
}
</script>
</body>
</html>
