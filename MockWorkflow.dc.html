<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap" rel="stylesheet">
<style>
@keyframes dcTravel { from { offset-distance:0%; } to { offset-distance:100%; } }
@keyframes dcHit { 0%,7%,100% { opacity:0; } 3.5% { opacity:1; } }
@keyframes dcCount { 0%,100% { opacity:1; } 50% { opacity:.5; } }
</style>
</helmet>
<div style="width:100%;background:#fff;border:1px solid #E3E8E5;border-radius:16px;overflow:hidden;box-shadow:0 30px 80px -30px rgba(8,30,20,.35);font-family:Manrope,system-ui,sans-serif;color:#141A17;font-size:12px;text-align:left">
  <div style="display:flex;align-items:center;gap:12px;padding:14px 16px 10px">
    <img src="assets/dcase-logo.png" alt="dcase" style="height:17px;width:auto;display:block">
    <div style="width:1px;height:18px;background:#E3E8E5"></div>
    <div><div style="font-size:14px;font-weight:800;letter-spacing:-.01em">Workflow Management</div><div style="font-size:10.5px;color:#7C8883">Product Development Pipeline · Last updated 2 hours ago</div></div>
    <div style="flex:1"></div>
    <div style="display:flex"><div style="width:22px;height:22px;border-radius:50%;background:#CFE7DC;border:2px solid #fff;font-size:8px;font-weight:800;display:grid;place-items:center;color:#0B3D2E">AM</div><div style="width:22px;height:22px;border-radius:50%;background:#7ADCB8;border:2px solid #fff;font-size:8px;font-weight:800;display:grid;place-items:center;color:#0B3D2E;margin-left:-8px">TK</div><div style="width:22px;height:22px;border-radius:50%;background:#0B3D2E;border:2px solid #fff;font-size:8px;font-weight:800;display:grid;place-items:center;color:#fff;margin-left:-8px">RB</div><div style="width:22px;height:22px;border-radius:50%;background:#EEF2F0;border:2px solid #fff;font-size:8px;font-weight:800;display:grid;place-items:center;color:#3B4A44;margin-left:-8px">+3</div></div>
    <div style="height:26px;padding:0 10px;border-radius:7px;background:#DDF6EA;color:#0B6B47;font-weight:700;display:flex;align-items:center;font-size:11px">+ New Workflow</div>
  </div>
  <div style="margin:0 12px;border:1px solid #E9EDEB;border-radius:12px;background:#FAFCFB;overflow:hidden">
    <svg viewBox="0 0 700 300" style="width:100%;height:auto;display:block" font-family="Manrope, system-ui, sans-serif">
      <path d="M54 90 H620 V230 H74" fill="none" stroke="#C9D3CE" stroke-width="1.5"></path>
      <path d="M300 66 V34" fill="none" stroke="#C9D3CE" stroke-width="1.5"></path>
      <polygon points="230,86 238,90 230,94" fill="#9AA5A0"></polygon><polygon points="370,86 378,90 370,94" fill="#9AA5A0"></polygon><polygon points="602,86 610,90 602,94" fill="#9AA5A0"></polygon><polygon points="558,226 550,230 558,234" fill="#9AA5A0"></polygon><polygon points="413,226 405,230 413,234" fill="#9AA5A0"></polygon><polygon points="268,226 260,230 268,234" fill="#9AA5A0"></polygon><polygon points="82,226 74,230 82,234" fill="#9AA5A0"></polygon>
      <rect x="120" y="172" width="440" height="116" rx="10" fill="none" stroke="#9AA5A0" stroke-width="1.2" stroke-dasharray="5 4"></rect>
      <text x="340" y="190" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3B4A44">Escalation Process</text>
      <circle cx="40" cy="90" r="14" fill="#fff" stroke="#3B4A44" stroke-width="1.6"></circle>
      <text x="40" y="118" text-anchor="middle" font-size="9" fill="#5A6661">Start Process</text>
      <rect x="90" y="64" width="140" height="52" rx="8" fill="#EEF7F3" stroke="#00BD80" stroke-width="1.2"></rect>
      <circle cx="106" cy="79" r="4" fill="none" stroke="#0B6B47" stroke-width="1.3"></circle>
      <text x="160" y="87" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0B3D2E">Get Customer</text><text x="160" y="100" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0B3D2E">Segment</text>
      <polygon points="300,66 324,90 300,114 276,90" fill="#fff" stroke="#3B4A44" stroke-width="1.6"></polygon>
      <path d="M292 82 L308 98 M308 82 L292 98" stroke="#3B4A44" stroke-width="1.6"></path>
      <text x="338" y="122" font-size="8.5" fill="#5A6661">is a VIP Customer</text>
      <text x="306" y="50" font-size="8.5" fill="#5A6661">is not a VIP Customer</text>
      <circle cx="300" cy="22" r="11" fill="#fff" stroke="#3B4A44" stroke-width="2.4"></circle>
      <text x="284" y="26" text-anchor="end" font-size="8.5" fill="#5A6661">End Process</text>
      <rect x="370" y="64" width="140" height="52" rx="8" fill="#EEF7F3" stroke="#00BD80" stroke-width="1.2"></rect>
      <circle cx="386" cy="79" r="4" fill="none" stroke="#0B6B47" stroke-width="1.3"></circle>
      <text x="440" y="87" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0B3D2E">Send Email To</text><text x="440" y="100" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0B3D2E">Agent</text>
      <circle cx="620" cy="90" r="18" fill="#fff" stroke="#3B4A44" stroke-width="1.4" stroke-dasharray="3 2.5"></circle>
      <circle cx="620" cy="90" r="13" fill="none" stroke="#3B4A44" stroke-width="1.2"></circle>
      <path d="M620 82 V90 L626 94" fill="none" stroke="#3B4A44" stroke-width="1.4"></path>
      <text x="620" y="128" text-anchor="middle" font-size="8.5" fill="#5A6661">Wait for SLA</text><text x="620" y="139" text-anchor="middle" font-size="8.5" fill="#5A6661">Violation</text>
      <rect x="430" y="205" width="120" height="50" rx="8" fill="#EEF7F3" stroke="#00BD80" stroke-width="1.2"></rect>
      <text x="490" y="227" text-anchor="middle" font-size="10" font-weight="700" fill="#0B3D2E">Notify</text><text x="490" y="240" text-anchor="middle" font-size="10" font-weight="700" fill="#0B3D2E">Escalation User</text>
      <rect x="285" y="205" width="120" height="50" rx="8" fill="#EEF7F3" stroke="#00BD80" stroke-width="1.2"></rect>
      <text x="345" y="227" text-anchor="middle" font-size="10" font-weight="700" fill="#0B3D2E">Update Ticket</text><text x="345" y="240" text-anchor="middle" font-size="10" font-weight="700" fill="#0B3D2E">Assignee</text>
      <rect x="140" y="205" width="120" height="50" rx="8" fill="#EEF7F3" stroke="#00BD80" stroke-width="1.2"></rect>
      <text x="200" y="227" text-anchor="middle" font-size="10" font-weight="700" fill="#0B3D2E">Get Escalation</text><text x="200" y="240" text-anchor="middle" font-size="10" font-weight="700" fill="#0B3D2E">User Detail</text>
      <circle cx="60" cy="230" r="14" fill="#fff" stroke="#3B4A44" stroke-width="2.6"></circle>
      <text x="60" y="258" text-anchor="middle" font-size="9" fill="#5A6661">End Process</text>
      <rect x="90" y="64" width="140" height="52" rx="8" fill="rgba(0,189,128,.22)" stroke="#00BD80" stroke-width="2.5" style="opacity:0;animation:dcHit 7s linear infinite;animation-delay:.55s"></rect>
      <polygon points="300,66 324,90 300,114 276,90" fill="rgba(0,189,128,.3)" stroke="#00BD80" stroke-width="2.5" style="opacity:0;animation:dcHit 7s linear infinite;animation-delay:1.35s"></polygon>
      <rect x="370" y="64" width="140" height="52" rx="8" fill="rgba(0,189,128,.22)" stroke="#00BD80" stroke-width="2.5" style="opacity:0;animation:dcHit 7s linear infinite;animation-delay:2.15s"></rect>
      <circle cx="620" cy="90" r="18" fill="rgba(0,189,128,.3)" stroke="#00BD80" stroke-width="2.5" style="opacity:0;animation:dcHit 7s linear infinite;animation-delay:3.15s"></circle>
      <rect x="430" y="205" width="120" height="50" rx="8" fill="rgba(0,189,128,.22)" stroke="#00BD80" stroke-width="2.5" style="opacity:0;animation:dcHit 7s linear infinite;animation-delay:4.65s"></rect>
      <rect x="285" y="205" width="120" height="50" rx="8" fill="rgba(0,189,128,.22)" stroke="#00BD80" stroke-width="2.5" style="opacity:0;animation:dcHit 7s linear infinite;animation-delay:5.45s"></rect>
      <rect x="140" y="205" width="120" height="50" rx="8" fill="rgba(0,189,128,.22)" stroke="#00BD80" stroke-width="2.5" style="opacity:0;animation:dcHit 7s linear infinite;animation-delay:6.25s"></rect>
      <circle cx="60" cy="230" r="14" fill="rgba(0,189,128,.35)" stroke="#00BD80" stroke-width="2.5" style="opacity:0;animation:dcHit 7s linear infinite;animation-delay:6.85s"></circle>
      <circle r="7" fill="#00BD80" style="offset-path:path('M54 90 H620 V230 H74');animation:dcTravel 7s linear infinite;filter:drop-shadow(0 0 6px rgba(0,189,128,.9))"></circle>
      <circle r="3" fill="#fff" style="offset-path:path('M54 90 H620 V230 H74');animation:dcTravel 7s linear infinite"></circle>
    </svg>
  </div>
  <sc-if value="{{ showTable }}" hint-placeholder-val="{{ true }}">
  <div style="margin:10px 12px 12px;border:1px solid #E9EDEB;border-radius:10px;overflow:hidden">
    <div style="display:grid;grid-template-columns:minmax(0,1fr) 64px 84px 84px;gap:8px;padding:7px 12px;background:#F8FAF9;color:#7C8883;font-size:10.5px;font-weight:700;border-bottom:1px solid #E9EDEB;white-space:nowrap"><div>Activity Name</div><div style="text-align:right">Instances</div><div style="text-align:right">Average</div><div style="text-align:right">Median</div></div>
    <sc-for list="{{ acts }}" as="a" hint-placeholder-count="3">
      <div style="display:grid;grid-template-columns:minmax(0,1fr) 64px 84px 84px;gap:8px;align-items:center;padding:0 12px;height:30px;border-bottom:1px solid #EFF3F1;font-size:11.5px;white-space:nowrap"><div style="font-weight:600;overflow:hidden;text-overflow:ellipsis">{{ a.name }}</div><div style="text-align:right;font-variant-numeric:tabular-nums;font-weight:700;color:#0B6B47">{{ a.n }}</div><div style="text-align:right;color:#3B4A44;font-variant-numeric:tabular-nums">{{ a.avg }}</div><div style="text-align:right;color:#3B4A44;font-variant-numeric:tabular-nums">{{ a.med }}</div></div>
    </sc-for>
  </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:760,&quot;height&quot;:560},&quot;showTable&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
const ACTS = [
  { name:'Get Customer Segment', n:148, avg:'00:00:00.4', med:'00:00:00.3' },
  { name:'Send Email To Agent', n:96, avg:'00:00:01.2', med:'00:00:00.9' },
  { name:'Notify Escalation User', n:31, avg:'00:01:18.2', med:'00:00:52.0' },
];
class Component extends DCLogic {
  state = { acts: ACTS.map(a => ({...a})) };
  componentDidMount(){ this.t = setInterval(() => this.setState(s => { const i = Math.random() < .6 ? 0 : Math.random() < .7 ? 1 : 2; const acts = s.acts.slice(); acts[i] = {...acts[i], n: acts[i].n + 1}; return { acts }; }), 2300); }
  componentWillUnmount(){ clearInterval(this.t); }
  renderVals(){ return { acts: this.state.acts, showTable: !(this.props.showTable === false || this.props.showTable === 'false') }; }
}
</script>
</body>
</html>
