<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@700&family=Outfit:wght@700&family=Urbanist:wght@800&family=Manrope:wght@800&family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Nunito:wght@800&family=Sora:wght@700&family=Lexend:wght@700&display=swap" rel="stylesheet">
<style>body { margin:0; background:#F4F6F5; }</style>
</helmet>
<div style="padding:40px;font-family:Manrope,system-ui,sans-serif;color:#141A17;display:flex;flex-direction:column;gap:28px">
  <div style="display:flex;flex-direction:column;gap:6px"><div style="font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#0B6B47">Marka yazısı · font alternatifleri</div><div style="font-size:15px;color:#4B5651">İkon sabit; yalnızca “DCase” yazısı değişiyor. Her seçenek açık ve koyu zeminde.</div></div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:18px">
    <sc-for list="{{ fonts }}" as="f" hint-placeholder-count="8">
      <div style="background:#fff;border:1px solid rgba(20,26,23,.1);border-radius:20px;overflow:hidden">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid rgba(20,26,23,.08)"><div style="display:flex;align-items:center;gap:10px"><span style="width:26px;height:26px;border-radius:8px;background:#00BD80;color:#062B20;display:grid;place-items:center;font-weight:800;font-size:13px">{{ f.n }}</span><span style="font-weight:800;font-size:15px">{{ f.name }}</span></div><span style="font-size:12.5px;color:#6F7B76">{{ f.note }}</span></div>
        <div style="padding:26px 24px;display:flex;align-items:center;justify-content:center;background:#fff"><div id="{{ f.idLight }}" style="display:inline-flex;align-items:center;gap:13px;padding-right:4px"><img src="assets/dcase-icon.png" alt="" style="height:64px;width:auto;display:block"><span style="font-weight: {{ f.weight }};font-size:43px;line-height:1;letter-spacing: {{ f.ls }};color:#333333;padding-bottom:3px;font-family: {{ f.family }}">DCase</span></div></div>
        <div style="padding:26px 24px;display:flex;align-items:center;justify-content:center;background:#0B0F0E"><div id="{{ f.idDark }}" style="display:inline-flex;align-items:center;gap:13px;padding-right:4px"><img src="assets/dcase-icon.png" alt="" style="height:64px;width:auto;display:block"><span style="font-weight: {{ f.weight }};font-size:43px;line-height:1;letter-spacing: {{ f.ls }};color:#FFFFFF;padding-bottom:3px;font-family: {{ f.family }}">DCase</span></div></div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1100,&quot;height&quot;:1200}}">
const FONTS = [
  { key:'quicksand', name:'Quicksand', family:"Quicksand, sans-serif", weight:700, ls:'-.01em', note:'Mevcut · yuvarlak geometrik, orijinale en yakın' },
  { key:'outfit', name:'Outfit', family:"Outfit, sans-serif", weight:700, ls:'-.02em', note:'Geometrik, modern SaaS; keskin ve net' },
  { key:'urbanist', name:'Urbanist', family:"Urbanist, sans-serif", weight:800, ls:'-.02em', note:'Geometrik, hafif yuvarlak uçlar; dengeli' },
  { key:'manrope', name:'Manrope', family:"Manrope, sans-serif", weight:800, ls:'-.03em', note:'Sitenin gövde fontu; tam tutarlılık' },
  { key:'bricolage', name:'Bricolage Grotesque', family:"'Bricolage Grotesque', sans-serif", weight:700, ls:'-.03em', note:'Sitenin başlık fontu; karakterli' },
  { key:'nunito', name:'Nunito', family:"Nunito, sans-serif", weight:800, ls:'-.02em', note:'Yuvarlak, sıcak ve samimi' },
  { key:'sora', name:'Sora', family:"Sora, sans-serif", weight:700, ls:'-.03em', note:'Teknik geometrik; yazılım hissi' },
  { key:'lexend', name:'Lexend', family:"Lexend, sans-serif", weight:700, ls:'-.02em', note:'Sade, yüksek okunabilirlik' },
];
class Component extends DCLogic {
  renderVals(){ return { fonts: FONTS.map((f, i) => ({ ...f, n: i + 1, idLight: 'logo-' + f.key + '-light', idDark: 'logo-' + f.key + '-dark' })) }; }
}
</script>
</body>
</html>
