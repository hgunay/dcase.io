<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap" rel="stylesheet">
</helmet>
<div style="width:100%;background:#fff;border:1px solid #E3E8E5;border-radius:16px;overflow:hidden;box-shadow:0 30px 80px -30px rgba(8,30,20,.35);font-family:Manrope,system-ui,sans-serif;color:#141A17;font-size:12px;text-align:left;padding:16px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px">
  <div style="display:flex;align-items:center;gap:12px"><img src="assets/dcase-logo.png" alt="dcase" style="height:17px"><div style="width:1px;height:18px;background:#E3E8E5"></div><div><div style="font-size:14px;font-weight:800;letter-spacing:-.01em;white-space:nowrap">Asset &amp; Configuration Overview</div><div style="font-size:10.5px;color:#7C8883;white-space:nowrap">Updated just now · All data is up to date</div></div><div style="flex:1"></div><span style="color:#7C8883;font-weight:800;letter-spacing:.1em">···</span></div>
  <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px">
    <sc-for list="{{ kpis }}" as="k" hint-placeholder-count="4"><div style="border:1px solid #E9EDEB;border-radius:10px;padding:9px 10px;min-width:0"><div style="font-size:9.5px;color:#7C8883;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ k.label }}</div><div style="font-size:17px;font-weight:800;letter-spacing:-.03em;margin-top:2px;font-variant-numeric:tabular-nums">{{ k.value }}</div><div style="font-size:9.5px;font-weight:700;white-space:nowrap;color: {{ k.c }}">{{ k.delta }}</div></div></sc-for>
  </div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px">
    <div style="border:1px solid #E9EDEB;border-radius:12px;padding:12px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><span style="font-weight:800;font-size:11.5px">Configuration Items by Type</span><span style="font-size:10px;color:#0B6B47;font-weight:700">View full report</span></div>
      <div style="display:flex;align-items:center;gap:12px">
        <div style="position:relative;width:92px;height:92px;flex:none"><svg viewBox="0 0 42 42" style="width:100%;height:100%;transform:rotate(-90deg)"><sc-for list="{{ segs }}" as="s" hint-placeholder-count="5"><circle cx="21" cy="21" r="15.9" fill="none" stroke="{{ s.c }}" stroke-width="6" stroke-dasharray="{{ s.d }}" stroke-dashoffset="{{ s.o }}" style="transition:stroke-dasharray 1.2s cubic-bezier(.2,.7,.2,1),stroke-dashoffset 1.2s cubic-bezier(.2,.7,.2,1)"></circle></sc-for></svg><div style="position:absolute;inset:0;display:grid;place-items:center;text-align:center"><div><div style="font-size:14px;font-weight:800;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums">{{ total }}</div><div style="font-size:8.5px;color:#7C8883">Total</div></div></div></div>
        <div style="display:flex;flex-direction:column;gap:5px;flex:1;min-width:0"><sc-for list="{{ legend }}" as="l" hint-placeholder-count="5"><div style="display:flex;align-items:center;gap:6px;font-size:10.5px"><span style="width:7px;height:7px;border-radius:50%;flex:none;background: {{ l.c }}"></span><span style="color:#3B4A44;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ l.name }}</span><span style="font-weight:800;font-variant-numeric:tabular-nums">{{ l.n }}</span><span style="color:#7C8883;font-variant-numeric:tabular-nums">{{ l.pct }}</span></div></sc-for></div>
      </div>
    </div>
    <div style="border:1px solid #E9EDEB;border-radius:12px;padding:12px;display:flex;flex-direction:column">
      <div style="font-weight:800;font-size:11.5px;margin-bottom:6px">Top Relationships</div>
      <svg viewBox="0 0 240 130" style="width:100%;height:auto;display:block;flex:1" font-family="Manrope, system-ui, sans-serif">
        <path d="M120 30 V50 M52 65 H92 M148 65 H188 M120 80 V100" stroke="#C9D3CE" stroke-width="1.5" stroke-dasharray="4 4" fill="none"></path>
        <circle cx="120" cy="20" r="13" fill="#DDF6EA"></circle><text x="120" y="24" text-anchor="middle" font-size="9" font-weight="800" fill="#0B6B47">WEB</text><text x="120" y="45" text-anchor="middle" font-size="8" fill="#5A6661">Web Server</text>
        <circle cx="40" cy="65" r="13" fill="#EEF2F0"></circle><text x="40" y="69" text-anchor="middle" font-size="9" font-weight="800" fill="#0B3D2E">DB</text><text x="40" y="90" text-anchor="middle" font-size="8" fill="#5A6661">Database</text>
        <circle cx="120" cy="65" r="17" fill="#0B3D2E"></circle><text x="120" y="69" text-anchor="middle" font-size="9" font-weight="800" fill="#fff">APP</text><text x="120" y="97" text-anchor="middle" font-size="8" fill="#5A6661">Application Server</text>
        <circle cx="200" cy="65" r="13" fill="#EEF2F0"></circle><text x="200" y="69" text-anchor="middle" font-size="9" font-weight="800" fill="#0B3D2E">LB</text><text x="200" y="90" text-anchor="middle" font-size="8" fill="#5A6661">Load Balancer</text>
        <circle cx="120" cy="112" r="13" fill="#DDF6EA"></circle><text x="120" y="116" text-anchor="middle" font-size="9" font-weight="800" fill="#0B6B47">STO</text>
      </svg>
      <div style="text-align:center;font-size:8px;color:#5A6661;margin-top:-4px">Storage</div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:#F4F6F5;font-size:11px"><span style="width:22px;height:22px;border-radius:7px;background:#DDF6EA;display:grid;place-items:center;color:#0B6B47;font-weight:900;flex:none">✦</span><div style="flex:1;min-width:0"><div style="font-weight:800;color:#0B6B47">AI Insights</div><div style="color:#3B4A44;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">3 optimization opportunities detected</div></div><span style="color:#7C8883">›</span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:640,&quot;height&quot;:520}}">
const TYPES = [['Servers',812,'#0B3D2E'],['Applications',564,'#00BD80'],['Network Devices',421,'#7ADCB8'],['Databases',312,'#CFE7DC'],['Others',208,'#E6ECE9']];
class Component extends DCLogic {
  state = { k: 0 };
  componentDidMount(){ this.t = setTimeout(() => this.setState({ k: 1 }), 200); }
  componentWillUnmount(){ clearTimeout(this.t); }
  renderVals(){
    const total = TYPES.reduce((a, t) => a + t[1], 0), k = this.state.k; let acc = 0;
    const segs = TYPES.map(t => { const p = t[1] / total * 100 * k; const s = { c: t[2], d: p.toFixed(2) + ' ' + (100 - p).toFixed(2), o: (-acc).toFixed(2) }; acc += p; return s; });
    return {
      kpis: [ { label:'Total Assets', value:'4,845', delta:'+8 this week', c:'#0B6B47' }, { label:'Configuration Items', value: total.toLocaleString('en-US'), delta:'+15 this week', c:'#0B6B47' }, { label:'Software Licenses', value:'1,273', delta:'+6 this week', c:'#0B6B47' }, { label:'Expiring Licenses', value:'38', delta:'In next 30 days', c:'#8A5A00' } ],
      total: total.toLocaleString('en-US'), segs,
      legend: TYPES.map(t => ({ name: t[0], n: t[1], pct: '(' + Math.round(t[1] / total * 100) + '%)', c: t[2] })),
    };
  }
}
</script>
</body>
</html>
