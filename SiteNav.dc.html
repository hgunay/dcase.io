<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap" rel="stylesheet">
<style>
@keyframes dcMenuIn { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:none; } }
</style>
<script type="module">import * as m from './copy.js'; window.DCASE_COPY = m.COPY; window.DCASE_LANG = m.getLang();</script>
</helmet>
<div onMouseLeave="{{ closeMenu }}" style="position:relative;width:100%;font-family:Manrope,system-ui,sans-serif;font-size:14px;transition:background .35s,border-color .35s,backdrop-filter .35s;background: {{ bg }};border-bottom:1px solid {{ border }};backdrop-filter: {{ blur }};-webkit-backdrop-filter: {{ blur }}">
  <div style="max-width:1200px;margin:0 auto;padding:0 24px;height:72px;display:flex;align-items:center;gap:28px">
    <a href="index.html" style="display:flex;align-items:center;text-decoration:none;flex:none">
      <sc-if value="{{ isDark }}" hint-placeholder-val="{{ false }}"><img src="assets/dcase-logo-dark.png" alt="dcase" style="height:30px;width:auto;display:block"></sc-if>
      <sc-if value="{{ isLight }}" hint-placeholder-val="{{ true }}"><img src="assets/dcase-logo.png" alt="dcase" style="height:30px;width:auto;display:block"></sc-if>
    </a>
    <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;align-items:center;gap:4px;margin-left:12px">
      <sc-for list="{{ items }}" as="it" hint-placeholder-count="5">
        <a href="{{ it.href }}" onMouseEnter="{{ it.enter }}" style="display:flex;align-items:center;gap:5px;padding:8px 12px;border-radius:9px;text-decoration:none;font-weight:600;font-size:14px;color: {{ it.color }};background: {{ it.bg }};transition:background .2s,color .2s">
          <span>{{ it.label }}</span>
          <sc-if value="{{ it.menu }}" hint-placeholder-val="{{ false }}"><svg width="10" height="10" viewBox="0 0 10 10" style="transition:transform .25s;transform: {{ it.rot }}"><path d="M2 3.5 L5 6.5 L8 3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></sc-if>
        </a>
      </sc-for>
    </div>
    </sc-if>
    <div style="flex:1"></div>
    <div style="display:flex;align-items:center;gap:2px;padding:3px;border-radius:999px;border:1px solid {{ border2 }}">
      <button onClick="{{ setEn }}" style="height:26px;padding:0 10px;border-radius:999px;border:none;cursor:pointer;font-family:inherit;font-weight:800;font-size:11.5px;letter-spacing:.04em;transition:all .2s;background: {{ enBg }};color: {{ enFg }}">EN</button>
      <button onClick="{{ setTr }}" style="height:26px;padding:0 10px;border-radius:999px;border:none;cursor:pointer;font-family:inherit;font-weight:800;font-size:11.5px;letter-spacing:.04em;transition:all .2s;background: {{ trBg }};color: {{ trFg }}">TR</button>
    </div>
    <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
    <a href="Contact.dc.html" style="display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 18px;border-radius:999px;background:#00BD80;color:#062B20;text-decoration:none;font-weight:800;font-size:14px;transition:transform .2s,box-shadow .2s;box-shadow:0 8px 24px -10px rgba(0,189,128,.7)" style-hover="transform:translateY(-1px);box-shadow:0 14px 30px -10px rgba(0,189,128,.8)">{{ cta }}<svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 7 H12 M8 3 L12 7 L8 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
    </sc-if>
    <sc-if value="{{ narrow }}" hint-placeholder-val="{{ false }}">
    <button onClick="{{ toggleMobile }}" aria-label="Menu" style="width:40px;height:40px;border-radius:10px;border:1px solid {{ border2 }};background:transparent;cursor:pointer;display:grid;place-items:center;color: {{ fg }}"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M2 5 H16 M2 9 H16 M2 13 H16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path></svg></button>
    </sc-if>
  </div>
  <sc-if value="{{ hasOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;left:0;right:0;top:100%;padding:8px 24px 0;animation:dcMenuIn .22s ease-out both">
      <div style="max-width:1200px;margin:0 auto;border-radius:18px;padding:22px 26px;display:grid;grid-template-columns: {{ panelCols }};gap:28px;background: {{ panelBg }};border:1px solid {{ border }};box-shadow:0 30px 80px -30px rgba(0,0,0,.45)">
        <sc-for list="{{ openCols }}" as="c" hint-placeholder-count="2">
          <div style="display:flex;flex-direction:column;gap:4px;min-width:0">
            <div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;padding:6px 10px 8px;color: {{ muted }}">{{ c.heading }}</div>
            <sc-for list="{{ c.links }}" as="l" hint-placeholder-count="3">
              <a href="{{ l.href }}" style="display:block;padding:8px 10px;border-radius:10px;text-decoration:none;transition:background .15s;color: {{ fg }}" style-hover="background: {{ hoverBg }}">
                <div style="font-weight:700;font-size:13.5px">{{ l.label }}</div>
                <sc-if value="{{ l.hasDesc }}" hint-placeholder-val="{{ true }}"><div style="font-size:12px;margin-top:2px;color: {{ muted }}">{{ l.desc }}</div></sc-if>
              </a>
            </sc-for>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{ mobileOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;left:0;right:0;top:100%;padding:8px 16px 16px;animation:dcMenuIn .22s ease-out both">
      <div style="border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:6px;background: {{ panelBg }};border:1px solid {{ border }};box-shadow:0 30px 80px -30px rgba(0,0,0,.45);max-height:70vh;overflow:auto">
        <sc-for list="{{ items }}" as="it" hint-placeholder-count="5">
          <a href="{{ it.href }}" style="display:block;padding:12px 12px;border-radius:10px;text-decoration:none;font-weight:800;font-size:16px;color: {{ fg }}">{{ it.label }}</a>
        </sc-for>
        <a href="Contact.dc.html" style="display:inline-flex;align-items:center;justify-content:center;height:46px;margin-top:8px;border-radius:999px;background:#00BD80;color:#062B20;text-decoration:none;font-weight:800;font-size:15px">{{ cta }}</a>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:120},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;en&quot;,&quot;options&quot;:[&quot;en&quot;,&quot;tr&quot;],&quot;tsType&quot;:&quot;'en' | 'tr'&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;light&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;tsType&quot;:&quot;'light' | 'dark'&quot;},&quot;onLang&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(lang: 'en' | 'tr') =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { copy: window.DCASE_COPY || null, open: null, scrolled: false, narrow: false, mobileOpen: false };
  componentDidMount(){
    import('./copy.js').then(m => this.setState({ copy: m.COPY }));
    this.onScroll = () => { const s = window.scrollY > 12; if (s !== this.state.scrolled) this.setState({ scrolled: s }); };
    this.onResize = () => { const n = window.innerWidth < 940; if (n !== this.state.narrow) this.setState({ narrow: n, mobileOpen: false }); };
    this.onKey = e => { if (e.key === 'Escape') this.setState({ open: null, mobileOpen: false }); };
    window.addEventListener('scroll', this.onScroll, { passive: true }); window.addEventListener('resize', this.onResize); window.addEventListener('keydown', this.onKey);
    this.onScroll(); this.onResize();
  }
  componentWillUnmount(){ window.removeEventListener('scroll', this.onScroll); window.removeEventListener('resize', this.onResize); window.removeEventListener('keydown', this.onKey); }
  renderVals(){
    const lang = this.props.lang === 'tr' ? 'tr' : 'en';
    const dark = this.props.theme === 'dark';
    const c = this.state.copy ? this.state.copy[lang].nav : { items: [], menus: {}, cta: '' };
    const { open, scrolled, narrow, mobileOpen } = this.state;
    const solid = scrolled || open != null || mobileOpen;
    const fg = dark ? '#F2F5F3' : '#141A17', muted = dark ? '#A8B3AE' : '#5A6661';
    const setLang = l => { const f = this.props.onLang; if (typeof f === 'function') f(l); };
    const items = c.items.map(it => ({
      ...it,
      color: open === it.key ? (dark ? '#fff' : '#0B3D2E') : fg,
      bg: open === it.key ? (dark ? 'rgba(255,255,255,.08)' : 'rgba(0,189,128,.12)') : 'transparent',
      rot: open === it.key ? 'rotate(180deg)' : 'none',
      enter: () => this.setState({ open: it.menu ? it.key : null }),
    }));
    const openCols = (open && c.menus[open]) ? c.menus[open].map(col => ({ heading: col.heading, links: col.links.map(l => ({ label: l[0], desc: l[1], hasDesc: !!l[1], href: l[2] || '#' })) })) : [];
    return {
      items, cta: c.cta, isDark: dark, isLight: !dark, fg, muted,
      wide: !narrow, narrow, mobileOpen,
      hasOpen: openCols.length > 0 && !narrow, openCols, panelCols: 'repeat(' + Math.max(1, openCols.length) + ', minmax(0,1fr))',
      closeMenu: () => this.setState({ open: null }),
      toggleMobile: () => this.setState(s => ({ mobileOpen: !s.mobileOpen })),
      setEn: () => setLang('en'), setTr: () => setLang('tr'),
      enBg: lang === 'en' ? (dark ? '#F2F5F3' : '#141A17') : 'transparent', enFg: lang === 'en' ? (dark ? '#0B0F0E' : '#fff') : muted,
      trBg: lang === 'tr' ? (dark ? '#F2F5F3' : '#141A17') : 'transparent', trFg: lang === 'tr' ? (dark ? '#0B0F0E' : '#fff') : muted,
      bg: solid ? (dark ? 'rgba(11,15,14,.78)' : 'rgba(250,250,247,.82)') : 'transparent',
      border: solid ? (dark ? 'rgba(255,255,255,.08)' : 'rgba(20,26,23,.08)') : 'transparent',
      border2: dark ? 'rgba(255,255,255,.14)' : 'rgba(20,26,23,.14)',
      blur: solid ? 'blur(14px)' : 'none',
      panelBg: dark ? '#121816' : '#FFFFFF', hoverBg: dark ? 'rgba(255,255,255,.06)' : 'rgba(0,189,128,.08)',
    };
  }
}
</script>
</body>
</html>
